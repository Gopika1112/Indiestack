name: indiestack-simple

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: indiestack-simple-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=indiestack
      - POSTGRES_PASSWORD=indiestack_secret
      - POSTGRES_DB=indiestack
    volumes:
      - simple_postgres_data:/var/lib/postgresql/data
      - ./backend/sql/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U indiestack -d indiestack" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - indiestack-simple-network

  redis:
    image: redis:7-alpine
    container_name: indiestack-simple-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - simple_redis_data:/data
    ports:
      - "6382:6379"
    networks:
      - indiestack-simple-network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: indiestack-simple-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=master_key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - simple_meilisearch_data:/meili_data
    ports:
      - "7703:7700"
    networks:
      - indiestack-simple-network

  nats:
    image: nats:latest
    container_name: indiestack-simple-nats
    restart: unless-stopped
    command: "-js -m 8222"
    ports:
      - "4225:4222"
      - "8225:8222"
    volumes:
      - simple_nats_data:/data/jetstream
    networks:
      - indiestack-simple-network

volumes:
  simple_postgres_data:
  simple_redis_data:
  simple_meilisearch_data:
  simple_nats_data:

networks:
  indiestack-simple-network:
    driver: bridge