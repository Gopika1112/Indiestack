version: "3.9"

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: indiestack-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=indiestack
      - POSTGRES_PASSWORD=indiestack_secret
      - POSTGRES_DB=indiestack
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indiestack -d indiestack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - indiestack-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: indiestack-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6381:6379"
    networks:
      - indiestack-network

  # MeiliSearch
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: indiestack-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=master_key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7702:7700"
    networks:
      - indiestack-network

  # NATS JetStream
  nats:
    image: nats:latest
    container_name: indiestack-nats
    restart: unless-stopped
    command: "-js -m 8222"
    ports:
      - "4224:4222"
      - "8224:8222"
    volumes:
      - nats_data:/data/jetstream
    networks:
      - indiestack-network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  nats_data:

networks:
  indiestack-network:
    driver: bridge
