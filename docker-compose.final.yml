services:
  # Next.js Frontend
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indiestack-nextjs
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    networks:
      - indiestack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Go API Backend
  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: indiestack-api
    environment:
      - SERVER_PORT=3001
      - DATABASE_URL=postgres://indiestack:indiestack_secret@postgres:5432/indiestack?sslmode=disable
      - JWT_SECRET=your-jwt-secret-change-in-production
    ports:
      - "3001:3001"
    networks:
      - indiestack-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: indiestack-caddy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - indiestack-network
    depends_on:
      - nextjs
      - go-api
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: indiestack-postgres
    environment:
      - POSTGRES_USER=indiestack
      - POSTGRES_PASSWORD=indiestack_secret
      - POSTGRES_DB=indiestack
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - indiestack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indiestack -d indiestack"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: indiestack-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    networks:
      - indiestack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # MeiliSearch
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: indiestack-meilisearch
    environment:
      - MEILI_MASTER_KEY=indiestack_meili_key
      - MEILI_ENV=development
    ports:
      - "7702:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - indiestack-network
    restart: unless-stopped

  # NATS
  nats:
    image: nats:2-alpine
    container_name: indiestack-nats
    ports:
      - "4224:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - indiestack-network
    restart: unless-stopped

networks:
  indiestack-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  nats-data:
