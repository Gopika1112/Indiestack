name: IndieStack Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run backend unit tests
      run: |
        cd backend
        go test -v ./internal/... ./internal/testutil/...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: indiestack
          POSTGRES_PASSWORD: indiestack_secret
          POSTGRES_DB: indiestack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Apply database schema
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        PGPASSWORD=indiestack_secret psql -h localhost -U indiestack -d indiestack_test -f backend/sql/migrations/001_init.sql
        PGPASSWORD=indiestack_secret psql -h localhost -U indiestack -d indiestack_test -f backend/sql/migrations/002_schema_patch.sql

    - name: Run database integration tests
      run: |
        cd backend
        go test -v -coverprofile=coverage.out ./tests/integration/...
      env:
        TEST_DATABASE_URL: postgres://indiestack:indiestack_secret@localhost:5432/indiestack_test?sslmode=disable
        DATABASE_URL: postgres://indiestack:indiestack_secret@localhost:5432/indiestack_test?sslmode=disable

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./backend/coverage.out
        flags: backend
        name: backend-coverage

  infrastructure-tests:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Start infrastructure
      run: |
        docker compose up -d postgres redis meilisearch nats
        sleep 15

    - name: Run health check
      run: |
        chmod +x scripts/testing/infrastructure-check.sh
        ./scripts/testing/infrastructure-check.sh

    - name: Check Docker container status
      run: |
        docker compose ps

  frontend-tests:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run go vet
      run: |
        cd backend
        go vet ./...

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, frontend-tests, infrastructure-tests, static-analysis]
    if: always()

    steps:
    - name: Check all tests passed
      run: |
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "Infrastructure Tests: ${{ needs.infrastructure-tests.result }}"
        echo "Static Analysis: ${{ needs.static-analysis.result }}"

        if [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ] || \
           [ "${{ needs.frontend-tests.result }}" != "success" ] || \
           [ "${{ needs.infrastructure-tests.result }}" != "success" ] || \
           [ "${{ needs.static-analysis.result }}" != "success" ]; then
          echo "Some critical tests failed"
          exit 1
        fi

        echo "All critical tests passed!"