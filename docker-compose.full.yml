name: indiestack-full

services:
  go-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.full
    container_name: indiestack-full-api
    restart: unless-stopped
    ports:
      - "3003:3001"
    environment:
      - APP_ENV=production
      - SERVER_PORT=3001
      - DATABASE_URL=postgres://indiestack:indiestack_secret@postgres:5432/indiestack?sslmode=disable
      - JWT_SECRET=your-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - indiestack-full-network

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indiestack-full-nextjs
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3003/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3002
      - API_URL=http://go-api:3001
    depends_on:
      - go-api
    networks:
      - indiestack-full-network

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: indiestack-full-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=indiestack
      - POSTGRES_PASSWORD=indiestack_secret
      - POSTGRES_DB=indiestack
    volumes:
      - full_postgres_data:/var/lib/postgresql/data
      - ./backend/sql/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U indiestack -d indiestack" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - indiestack-full-network

  redis:
    image: redis:7-alpine
    container_name: indiestack-full-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - full_redis_data:/data
    ports:
      - "6383:6379"
    networks:
      - indiestack-full-network

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: indiestack-full-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=master_key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - full_meilisearch_data:/meili_data
    ports:
      - "7704:7700"
    networks:
      - indiestack-full-network

  nats:
    image: nats:latest
    container_name: indiestack-full-nats
    restart: unless-stopped
    command: "-js -m 8222"
    ports:
      - "4226:4222"
      - "8226:8222"
    volumes:
      - full_nats_data:/data/jetstream
    networks:
      - indiestack-full-network

volumes:
  full_postgres_data:
  full_redis_data:
  full_meilisearch_data:
  full_nats_data:

networks:
  indiestack-full-network:
    driver: bridge